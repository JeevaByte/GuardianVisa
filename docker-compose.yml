version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    env_file:
      - .env
    networks:
      - guardianvisa-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - guardianvisa-network
    restart: unless-stopped

networks:
  guardianvisa-network:
    driver: bridge
