steps:
  # Step 1: Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/guardianvisa-backend:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/guardianvisa-backend:latest
      - ./backend

  # Step 2: Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/guardianvisa-frontend:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/guardianvisa-frontend:latest
      - ./frontend

  # Step 3: Push both images
  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    waitFor: [build-backend]
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/guardianvisa-backend

  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    waitFor: [build-frontend]
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/guardianvisa-frontend

  # Step 4: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-backend
    waitFor: [push-backend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - guardianvisa-backend
      - --image=gcr.io/$PROJECT_ID/guardianvisa-backend:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=8080
      - --memory=512Mi
      - --allow-unauthenticated
      - --set-env-vars=MONGODB_URI=${_MONGODB_URI}

  # Step 5: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-frontend
    waitFor: [push-frontend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - guardianvisa-frontend
      - --image=gcr.io/$PROJECT_ID/guardianvisa-frontend:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=80
      - --memory=256Mi
      - --allow-unauthenticated

substitutions:
  _MONGODB_URI: ''
  _GCP_PROJECT_ID: ''

images:
  - gcr.io/$PROJECT_ID/guardianvisa-backend:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/guardianvisa-frontend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
